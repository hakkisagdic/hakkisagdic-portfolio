name: Deploy Customer Stack

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  CUSTOMER_NAME: ${{ vars.CUSTOMER_NAME }}
  IMAGE_NAME: ${{ vars.CUSTOMER_NAME }}/app
  # Determine provider based on environment or global variable
  # Default to aws if not specified
  CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER || 'aws' }}

jobs:
  # ===========================================================================
  # BUILD - Runs on all pushes
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      registry: ${{ steps.registry.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=sha-${GITHUB_SHA::8}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set Registry URL
        id: registry
        run: |
          if [[ "${{ env.CLOUD_PROVIDER }}" == "aws" ]]; then
            echo "registry=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT
          else
            echo "registry=${{ vars.ACR_NAME }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine environment tag
        id: env-tag
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == "refs/heads/staging" ]]; then
            echo "tag=staging" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Azure Login
      - name: Login to ACR
        if: github.event_name != 'pull_request' && env.CLOUD_PROVIDER == 'azure'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ steps.registry.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # AWS Login
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && env.CLOUD_PROVIDER == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request' && env.CLOUD_PROVIDER == 'aws'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.env-tag.outputs.tag }}

  # ===========================================================================
  # DEV Deployment
  # ===========================================================================
  deploy-dev:
    needs: build
    if: github.event.inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/tmp/${{ env.CUSTOMER_NAME }}"

      - name: Deploy to DEV
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          envs: CUSTOMER_NAME,CLOUD_PROVIDER
          script: |
            set -e
            ENV_SUFFIX="dev"
            STACK_NAME="${{ env.CUSTOMER_NAME }}-${ENV_SUFFIX}"
            DEPLOY_DIR="/opt/swarm/customers/${STACK_NAME}"
            VERSION="${{ needs.build.outputs.version }}"
            REGISTRY="${{ needs.build.outputs.registry }}"

            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown $USER:$USER "$DEPLOY_DIR"
            cp "/tmp/${{ env.CUSTOMER_NAME }}/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
            rm -rf "/tmp/${{ env.CUSTOMER_NAME }}"

            cd "$DEPLOY_DIR"

            cat > .env << ENVEOF
            VERSION=${VERSION}
            REGISTRY=${REGISTRY}
            CUSTOMER_NAME=${{ env.CUSTOMER_NAME }}
            DOMAIN=dev.${{ vars.DOMAIN }}
            REPLICAS=1
            ENVEOF

            # Registry Login on Server
            if [[ "${{ env.CLOUD_PROVIDER }}" == "aws" ]]; then
              aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}
            else
              echo "${{ secrets.ACR_PASSWORD }}" | docker login ${REGISTRY} -u ${{ secrets.ACR_USERNAME }} --password-stdin
            fi

            # Render and Deploy
            cat docker-compose.yml | sed "s|\${VERSION:-latest}|${VERSION}|g" | sed "s|\${REPLICAS:-1}|1|g" | envsubst '\$REGISTRY \$CUSTOMER_NAME \$DOMAIN' > docker-compose.rendered.yml
            
            # Simple replace for sensitive vars (Improvement: use the same python logic if needed)
            sed -i "s|\${DB_PASSWORD}|${{ secrets.DB_PASSWORD }}|g" docker-compose.rendered.yml
            sed -i "s|\${NEXTAUTH_SECRET}|${{ secrets.NEXTAUTH_SECRET }}|g" docker-compose.rendered.yml

            docker stack deploy -c docker-compose.rendered.yml --with-registry-auth ${STACK_NAME}

  # ===========================================================================
  # STAGING Deployment
  # ===========================================================================
  deploy-staging:
    needs: build
    if: github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/tmp/${{ env.CUSTOMER_NAME }}"
      - name: Deploy to STAGING
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          envs: CUSTOMER_NAME,CLOUD_PROVIDER
          script: |
            set -e
            ENV_SUFFIX="staging"
            STACK_NAME="${{ env.CUSTOMER_NAME }}-${ENV_SUFFIX}"
            DEPLOY_DIR="/opt/swarm/customers/${STACK_NAME}"
            VERSION="${{ needs.build.outputs.version }}"
            REGISTRY="${{ needs.build.outputs.registry }}"

            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown $USER:$USER "$DEPLOY_DIR"
            cp "/tmp/${{ env.CUSTOMER_NAME }}/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
            rm -rf "/tmp/${{ env.CUSTOMER_NAME }}"
            cd "$DEPLOY_DIR"

            cat > .env << ENVEOF
            VERSION=${VERSION}
            REGISTRY=${REGISTRY}
            CUSTOMER_NAME=${{ env.CUSTOMER_NAME }}
            DOMAIN=stage.${{ vars.DOMAIN }}
            REPLICAS=1
            ENVEOF

            if [[ "${{ env.CLOUD_PROVIDER }}" == "aws" ]]; then
              aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}
            else
              echo "${{ secrets.ACR_PASSWORD }}" | docker login ${REGISTRY} -u ${{ secrets.ACR_USERNAME }} --password-stdin
            fi

            cat docker-compose.yml | sed "s|\${VERSION:-latest}|${VERSION}|g" | sed "s|\${REPLICAS:-1}|1|g" | envsubst '\$REGISTRY \$CUSTOMER_NAME \$DOMAIN' > docker-compose.rendered.yml
            sed -i "s|\${DB_PASSWORD}|${{ secrets.DB_PASSWORD }}|g" docker-compose.rendered.yml
            sed -i "s|\${NEXTAUTH_SECRET}|${{ secrets.NEXTAUTH_SECRET }}|g" docker-compose.rendered.yml

            docker stack deploy -c docker-compose.rendered.yml --with-registry-auth ${STACK_NAME}

  # ===========================================================================
  # PROD Deployment
  # ===========================================================================
  deploy-prod:
    needs: build
    if: github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/tmp/${{ env.CUSTOMER_NAME }}"

      - name: Deploy to PRODUCTION
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          envs: CUSTOMER_NAME,CLOUD_PROVIDER
          script: |
            set -e
            ENV_SUFFIX="prod"
            STACK_NAME="${{ env.CUSTOMER_NAME }}-${ENV_SUFFIX}"
            DEPLOY_DIR="/opt/swarm/customers/${STACK_NAME}"
            VERSION="${{ needs.build.outputs.version }}"
            REGISTRY="${{ needs.build.outputs.registry }}"

            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown $USER:$USER "$DEPLOY_DIR"
            cp "/tmp/${{ env.CUSTOMER_NAME }}/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
            rm -rf "/tmp/${{ env.CUSTOMER_NAME }}"
            cd "$DEPLOY_DIR"

            cat > .env << ENVEOF
            VERSION=${VERSION}
            REGISTRY=${REGISTRY}
            CUSTOMER_NAME=${{ env.CUSTOMER_NAME }}
            DOMAIN=${{ vars.DOMAIN }}
            REPLICAS=2
            ENVEOF

            if [[ "${{ env.CLOUD_PROVIDER }}" == "aws" ]]; then
              aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}
            else
              echo "${{ secrets.ACR_PASSWORD }}" | docker login ${REGISTRY} -u ${{ secrets.ACR_USERNAME }} --password-stdin
            fi

            cat docker-compose.yml | sed "s|\${VERSION:-latest}|${VERSION}|g" | sed "s|\${REPLICAS:-1}|2|g" | envsubst '\$REGISTRY \$CUSTOMER_NAME \$DOMAIN' > docker-compose.rendered.yml
            sed -i "s|\${DB_PASSWORD}|${{ secrets.DB_PASSWORD }}|g" docker-compose.rendered.yml
            sed -i "s|\${NEXTAUTH_SECRET}|${{ secrets.NEXTAUTH_SECRET }}|g" docker-compose.rendered.yml

            docker stack deploy -c docker-compose.rendered.yml --with-registry-auth ${STACK_NAME}
