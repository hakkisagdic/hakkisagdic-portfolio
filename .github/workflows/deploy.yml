name: Deploy Customer Stack

on:
  push:
    branches:
      - dev
      - staging
      - main
    tags: ['v*']
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  CUSTOMER_NAME: ${{ vars.CUSTOMER_NAME }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: ${{ vars.CUSTOMER_NAME }}/app

jobs:
  # ===========================================================================
  # BUILD - Runs on all pushes
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=sha-${GITHUB_SHA::8}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        if: github.event_name != 'pull_request'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

  # ===========================================================================
  # DEV Deployment - Triggered by push to 'dev' branch
  # ===========================================================================
  deploy-dev:
    needs: build
    if: (github.ref == 'refs/heads/dev' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/tmp/${{ env.CUSTOMER_NAME }}"
          strip_components: 0

      - name: Deploy to DEV
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          envs: CUSTOMER_NAME,ACR_NAME
          script: |
            set -e

            # Environment-specific naming for multi-environment support
            ENV_SUFFIX="dev"
            STACK_NAME="${{ env.CUSTOMER_NAME }}-${ENV_SUFFIX}"
            DEPLOY_DIR="/opt/swarm/customers/${STACK_NAME}"
            VERSION="${{ needs.build.outputs.version }}"

            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown $USER:$USER "$DEPLOY_DIR"

            cp "/tmp/${{ env.CUSTOMER_NAME }}/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
            rm -rf "/tmp/${{ env.CUSTOMER_NAME }}"

            cd "$DEPLOY_DIR"

            # DEV environment: dev.domain.com, 1 replica
            echo "Updating .env file for DEV..."
            cat > .env << 'ENVEOF'
            VERSION=__VERSION__
            ACR_NAME=__ACR_NAME__
            CUSTOMER_NAME=__CUSTOMER_NAME__
            DOMAIN=__DOMAIN__
            REPLICAS=1
            ENVEOF

            # Replace placeholders with actual values (keep CUSTOMER_NAME original for image path)
            sed -i "s|__VERSION__|${VERSION}|g" .env
            sed -i "s|__ACR_NAME__|${{ env.ACR_NAME }}|g" .env
            sed -i "s|__CUSTOMER_NAME__|${{ env.CUSTOMER_NAME }}|g" .env
            sed -i "s|__DOMAIN__|dev.${{ vars.DOMAIN }}|g" .env

            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_NAME }}.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

            source .env
            export VERSION ACR_NAME CUSTOMER_NAME DOMAIN REPLICAS

            # First pass: envsubst for non-sensitive variables only
            # IMPORTANT: Must specify which vars to substitute, otherwise envsubst replaces ALL ${VAR} including DB_PASSWORD
            cat docker-compose.yml | sed "s/\${VERSION:-latest}/$VERSION/g" | sed "s/\${REPLICAS:-1}/$REPLICAS/g" | envsubst '$ACR_NAME $CUSTOMER_NAME $DOMAIN' > docker-compose.rendered.yml

            # Second pass: Replace sensitive values using Python (handles special chars safely)
            # Also update Traefik router names to be environment-specific
            export STACK_NAME
            python3 << 'PYEOF'
            import sys, os
            db_pwd = '''${{ secrets.DB_PASSWORD }}'''
            nextauth = '''${{ secrets.NEXTAUTH_SECRET }}'''
            customer_name = '''${{ env.CUSTOMER_NAME }}'''
            stack_name = os.environ.get('STACK_NAME', customer_name)
            with open('docker-compose.rendered.yml', 'r') as f:
                content = f.read()
            content = content.replace('${DB_PASSWORD}', db_pwd)
            content = content.replace('${NEXTAUTH_SECRET}', nextauth)
            # Update Traefik router names to be unique per environment
            content = content.replace(f'routers.{customer_name}', f'routers.{stack_name}')
            content = content.replace(f'services.{customer_name}', f'services.{stack_name}')
            with open('docker-compose.rendered.yml', 'w') as f:
                f.write(content)
            PYEOF

            docker stack deploy -c docker-compose.rendered.yml --with-registry-auth ${STACK_NAME}

            sleep 30
            echo "=== Stack Services ==="
            docker stack services ${STACK_NAME}
            echo "=== DEV Deployment Complete ==="
            echo "🌐 URL: https://dev.${{ vars.DOMAIN }}"

  # ===========================================================================
  # Create Draft PR to Staging - After successful DEV deployment
  # ===========================================================================
  create-staging-pr:
    needs: deploy-dev
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for existing PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --head dev --base staging --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "existing_pr=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "PR #$EXISTING_PR already exists"
          else
            echo "existing_pr=" >> $GITHUB_OUTPUT
          fi

      - name: Create Draft PR to Staging
        if: steps.check-pr.outputs.existing_pr == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base staging \
            --head dev \
            --title "🚀 Deploy to Staging: $(git log -1 --pretty=%s)" \
            --body "## Auto-generated PR from DEV deployment

          ### Changes
          $(git log staging..dev --oneline 2>/dev/null || echo 'New changes from dev branch')

          ### Deployment Flow
          1. ✅ DEV deployment successful
          2. ⏳ Review and approve this PR
          3. 🕐 5 minute wait timer after merge
          4. 🚀 Auto-deploy to STAGING

          ---
          _This PR was automatically created after successful DEV deployment._" \
            --draft

  # ===========================================================================
  # STAGING Deployment - Triggered by push to 'staging' branch (PR merge)
  # Environment has 5 minute wait timer
  # ===========================================================================
  deploy-staging:
    needs: build
    if: (github.ref == 'refs/heads/staging' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/tmp/${{ env.CUSTOMER_NAME }}"

      - name: Deploy to STAGING
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          envs: CUSTOMER_NAME,ACR_NAME
          script: |
            set -e

            # Environment-specific naming for multi-environment support
            ENV_SUFFIX="stg"
            STACK_NAME="${{ env.CUSTOMER_NAME }}-${ENV_SUFFIX}"
            DEPLOY_DIR="/opt/swarm/customers/${STACK_NAME}"
            VERSION="${{ needs.build.outputs.version }}"

            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown $USER:$USER "$DEPLOY_DIR"
            cp "/tmp/${{ env.CUSTOMER_NAME }}/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
            rm -rf "/tmp/${{ env.CUSTOMER_NAME }}"

            cd "$DEPLOY_DIR"

            # STAGING environment: stg.domain.com, 1 replica
            echo "Updating .env file for STAGING..."
            cat > .env << 'ENVEOF'
            VERSION=__VERSION__
            ACR_NAME=__ACR_NAME__
            CUSTOMER_NAME=__CUSTOMER_NAME__
            DOMAIN=__DOMAIN__
            REPLICAS=1
            ENVEOF

            # Replace placeholders with actual values (keep CUSTOMER_NAME original for image path)
            sed -i "s|__VERSION__|${VERSION}|g" .env
            sed -i "s|__ACR_NAME__|${{ env.ACR_NAME }}|g" .env
            sed -i "s|__CUSTOMER_NAME__|${{ env.CUSTOMER_NAME }}|g" .env
            sed -i "s|__DOMAIN__|stg.${{ vars.DOMAIN }}|g" .env

            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_NAME }}.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

            source .env
            export VERSION ACR_NAME CUSTOMER_NAME DOMAIN REPLICAS

            # First pass: envsubst for non-sensitive variables only
            # IMPORTANT: Must specify which vars to substitute, otherwise envsubst replaces ALL ${VAR} including DB_PASSWORD
            cat docker-compose.yml | sed "s/\${VERSION:-latest}/$VERSION/g" | sed "s/\${REPLICAS:-1}/$REPLICAS/g" | envsubst '$ACR_NAME $CUSTOMER_NAME $DOMAIN' > docker-compose.rendered.yml

            # Second pass: Replace sensitive values using Python (handles special chars safely)
            # Also update Traefik router names to be environment-specific
            export STACK_NAME
            python3 << 'PYEOF'
            import sys, os
            db_pwd = '''${{ secrets.DB_PASSWORD }}'''
            nextauth = '''${{ secrets.NEXTAUTH_SECRET }}'''
            customer_name = '''${{ env.CUSTOMER_NAME }}'''
            stack_name = os.environ.get('STACK_NAME', customer_name)
            with open('docker-compose.rendered.yml', 'r') as f:
                content = f.read()
            content = content.replace('${DB_PASSWORD}', db_pwd)
            content = content.replace('${NEXTAUTH_SECRET}', nextauth)
            # Update Traefik router names to be unique per environment
            content = content.replace(f'routers.{customer_name}', f'routers.{stack_name}')
            content = content.replace(f'services.{customer_name}', f'services.{stack_name}')
            with open('docker-compose.rendered.yml', 'w') as f:
                f.write(content)
            PYEOF

            docker stack deploy -c docker-compose.rendered.yml --with-registry-auth ${STACK_NAME}

            sleep 30
            docker stack services ${STACK_NAME}
            echo "=== STAGING Deployment Complete ==="
            echo "🌐 URL: https://stg.${{ vars.DOMAIN }}"

  # ===========================================================================
  # Create Draft PR to Production - After successful STAGING deployment
  # ===========================================================================
  create-prod-pr:
    needs: deploy-staging
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for existing PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --head staging --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "existing_pr=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "PR #$EXISTING_PR already exists"
          else
            echo "existing_pr=" >> $GITHUB_OUTPUT
          fi

      - name: Create Draft PR to Production
        if: steps.check-pr.outputs.existing_pr == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head staging \
            --title "🚀 Deploy to Production: $(git log -1 --pretty=%s)" \
            --body "## Auto-generated PR from STAGING deployment

          ### Changes
          $(git log main..staging --oneline 2>/dev/null || echo 'New changes from staging branch')

          ### Deployment Flow
          1. ✅ DEV deployment successful
          2. ✅ STAGING deployment successful
          3. ⏳ Review and approve this PR
          4. 🕐 5 minute wait timer after merge
          5. 🚀 Auto-deploy to PRODUCTION

          ### Pre-Production Checklist
          - [ ] Staging environment tested
          - [ ] No critical bugs found
          - [ ] Performance acceptable
          - [ ] Ready for production

          ---
          _This PR was automatically created after successful STAGING deployment._" \
            --draft

  # ===========================================================================
  # PROD Deployment - Triggered by push to 'main' branch (PR merge) OR v* tag
  # Environment has 5 minute wait timer + required reviewer approval
  # ===========================================================================
  deploy-prod:
    needs: build
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/tmp/${{ env.CUSTOMER_NAME }}"

      - name: Deploy to PRODUCTION
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          envs: CUSTOMER_NAME,ACR_NAME
          script: |
            set -e

            # Environment-specific naming for multi-environment support
            ENV_SUFFIX="prod"
            STACK_NAME="${{ env.CUSTOMER_NAME }}-${ENV_SUFFIX}"
            DEPLOY_DIR="/opt/swarm/customers/${STACK_NAME}"
            VERSION="${{ needs.build.outputs.version }}"

            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown $USER:$USER "$DEPLOY_DIR"
            cp "/tmp/${{ env.CUSTOMER_NAME }}/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
            rm -rf "/tmp/${{ env.CUSTOMER_NAME }}"

            cd "$DEPLOY_DIR"

            # Backup existing .env
            if [ -f .env ]; then
              cp .env ".env.backup.$(date +%Y%m%d_%H%M%S)"
            fi

            # PROD environment: domain.com + www.domain.com, 2 replicas for HA
            echo "Updating .env file for PRODUCTION..."
            cat > .env << 'ENVEOF'
            VERSION=__VERSION__
            ACR_NAME=__ACR_NAME__
            CUSTOMER_NAME=__CUSTOMER_NAME__
            DOMAIN=__DOMAIN__
            REPLICAS=2
            ENVEOF

            # Replace placeholders with actual values (keep CUSTOMER_NAME original for image path)
            sed -i "s|__VERSION__|${VERSION}|g" .env
            sed -i "s|__ACR_NAME__|${{ env.ACR_NAME }}|g" .env
            sed -i "s|__CUSTOMER_NAME__|${{ env.CUSTOMER_NAME }}|g" .env
            sed -i "s|__DOMAIN__|${{ vars.DOMAIN }}|g" .env

            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_NAME }}.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

            source .env
            export VERSION ACR_NAME CUSTOMER_NAME DOMAIN REPLICAS

            # First pass: envsubst for non-sensitive variables only
            # IMPORTANT: Must specify which vars to substitute, otherwise envsubst replaces ALL ${VAR} including DB_PASSWORD
            cat docker-compose.yml | sed "s/\${VERSION:-latest}/$VERSION/g" | sed "s/\${REPLICAS:-1}/$REPLICAS/g" | envsubst '$ACR_NAME $CUSTOMER_NAME $DOMAIN' > docker-compose.rendered.yml

            # Second pass: Replace sensitive values using Python (handles special chars safely)
            # Also update Traefik router names to be environment-specific
            export STACK_NAME
            python3 << 'PYEOF'
            import sys, os
            db_pwd = '''${{ secrets.DB_PASSWORD }}'''
            nextauth = '''${{ secrets.NEXTAUTH_SECRET }}'''
            customer_name = '''${{ env.CUSTOMER_NAME }}'''
            domain = '''${{ vars.DOMAIN }}'''
            stack_name = os.environ.get('STACK_NAME', customer_name)
            with open('docker-compose.rendered.yml', 'r') as f:
                content = f.read()
            content = content.replace('${DB_PASSWORD}', db_pwd)
            content = content.replace('${NEXTAUTH_SECRET}', nextauth)
            # Update Traefik router names to be unique per environment
            content = content.replace(f'routers.{customer_name}', f'routers.{stack_name}')
            content = content.replace(f'services.{customer_name}', f'services.{stack_name}')
            content = content.replace(f'middlewares.{customer_name}', f'middlewares.{stack_name}')

            # PROD only: Add redirect from non-www to www
            redirect_lines = [
                f'        - "traefik.http.routers.{stack_name}.middlewares={stack_name}-redirect-www"',
                f'        - "traefik.http.middlewares.{stack_name}-redirect-www.redirectregex.regex=^https://{domain}(.*)"',
                f'        - "traefik.http.middlewares.{stack_name}-redirect-www.redirectregex.replacement=https://www.{domain}$$$${{{{1}}}}"',
                f'        - "traefik.http.middlewares.{stack_name}-redirect-www.redirectregex.permanent=true"'
            ]
            redirect_labels = '\n' + '\n'.join(redirect_lines)

            # Find the non-www router's tls line and add redirect after it
            search = f'- "traefik.http.routers.{stack_name}.tls.certresolver=letsencrypt"'
            if search in content:
                content = content.replace(search, search + redirect_labels, 1)

            # Also update NEXTAUTH_URL to use www for PROD
            content = content.replace(f'NEXTAUTH_URL=https://{domain}', f'NEXTAUTH_URL=https://www.{domain}')

            with open('docker-compose.rendered.yml', 'w') as f:
                f.write(content)
            PYEOF

            docker stack deploy -c docker-compose.rendered.yml --with-registry-auth ${STACK_NAME}

            sleep 30
            echo "=== Stack Services ==="
            docker stack services ${STACK_NAME}
            echo "=== PRODUCTION Deployment Complete ==="
            echo "🌐 Primary URL: https://www.${{ vars.DOMAIN }}"
            echo "🔄 Redirect: https://${{ vars.DOMAIN }} -> https://www.${{ vars.DOMAIN }}"
