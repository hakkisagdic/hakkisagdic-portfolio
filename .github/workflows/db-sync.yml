name: Database Sync

on:
  workflow_dispatch:
    inputs:
      source_stack:
        description: 'Source stack name (e.g., hakkisagdic-portfolio or hakkisagdic-portfolio-dev)'
        required: true
        type: string
        default: 'hakkisagdic-portfolio'
      target_stack:
        description: 'Target stack name (e.g., hakkisagdic-portfolio-prod)'
        required: true
        type: string
        default: 'hakkisagdic-portfolio-prod'
      sync_type:
        description: 'Sync type'
        required: true
        type: choice
        options:
          - data_only
          - schema_and_data
          - seed_only
          - debug

env:
  CUSTOMER_NAME: ${{ vars.CUSTOMER_NAME }}

jobs:
  sync-database:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Sync Database
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          envs: CUSTOMER_NAME
          script: |
            set -e

            SOURCE_STACK="${{ github.event.inputs.source_stack }}"
            TARGET_STACK="${{ github.event.inputs.target_stack }}"
            SYNC_TYPE="${{ github.event.inputs.sync_type }}"

            echo "=== Database Sync ==="
            echo "Source Stack: ${SOURCE_STACK}"
            echo "Target Stack: ${TARGET_STACK}"
            echo "Type: ${SYNC_TYPE}"
            echo ""

            # Debug mode - run first, before container checks
            if [ "$SYNC_TYPE" = "debug" ]; then
              echo "=== Debug Mode ==="
              echo ""
              echo "📋 ALL Docker Stacks:"
              docker stack ls
              echo ""
              echo "📋 All Docker containers:"
              docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" | head -40
              echo ""
              echo "📋 Stack services for ${TARGET_STACK}:"
              docker stack services ${TARGET_STACK} 2>/dev/null || echo "Stack not found"
              echo ""
              echo "📋 Service tasks for ${TARGET_STACK}_portfolio:"
              docker service ps ${TARGET_STACK}_portfolio --no-trunc 2>&1 || echo "Portfolio service not found"
              echo ""
              echo "📋 Service logs for ${TARGET_STACK}_portfolio (last 100 lines):"
              docker service logs ${TARGET_STACK}_portfolio --tail 100 2>&1 || echo "No portfolio logs found"
              echo ""
              echo "📋 Service tasks for ${TARGET_STACK}_db:"
              docker service ps ${TARGET_STACK}_db --no-trunc 2>&1 || echo "DB service not found"
              echo ""
              echo "📋 Service logs for ${TARGET_STACK}_db (last 50 lines):"
              docker service logs ${TARGET_STACK}_db --tail 50 2>&1 || echo "No db logs found"
              echo ""
              echo "📋 Docker volumes:"
              docker volume ls | grep -E "(portfolio|postgres)" || echo "No matching volumes"
              echo ""
              echo "📋 Docker networks:"
              docker network ls | grep -E "(portfolio|internal)" || echo "No matching networks"
              echo ""
              echo "📋 Deployment directory for ${TARGET_STACK}:"
              DEPLOY_DIR="/opt/swarm/customers/${TARGET_STACK}"
              if [ -d "$DEPLOY_DIR" ]; then
                ls -la "$DEPLOY_DIR"
                echo ""
                echo "📋 .env file:"
                cat "$DEPLOY_DIR/.env" 2>/dev/null || echo "No .env file"
                echo ""
                echo "📋 Rendered docker-compose.yml (first 80 lines):"
                head -80 "$DEPLOY_DIR/docker-compose.rendered.yml" 2>/dev/null || echo "No rendered compose file"
              else
                echo "Directory not found: $DEPLOY_DIR"
              fi
              echo ""
              echo "📋 System resources:"
              free -h
              df -h /var/lib/docker
              echo ""
              echo "=== Debug Complete ==="
              exit 0
            fi

            # List all containers for debugging
            echo "All running containers:"
            docker ps --format "{{.Names}}" | grep -E "(db|portfolio)" || true
            echo ""

            # Get container IDs - use partial name match
            SOURCE_DB=$(docker ps --format "{{.ID}} {{.Names}}" | grep "${SOURCE_STACK}_db" | awk '{print $1}' | head -1)
            TARGET_DB=$(docker ps --format "{{.ID}} {{.Names}}" | grep "${TARGET_STACK}_db" | awk '{print $1}' | head -1)

            if [ -z "$SOURCE_DB" ]; then
              echo "❌ Source database container not found for stack: ${SOURCE_STACK}"
              echo "Looking for: ${SOURCE_STACK}_db"
              exit 1
            fi

            if [ -z "$TARGET_DB" ]; then
              echo "❌ Target database container not found for stack: ${TARGET_STACK}"
              echo "Looking for: ${TARGET_STACK}_db"
              exit 1
            fi

            echo "Source DB container: $SOURCE_DB"
            echo "Target DB container: $TARGET_DB"

            if [ "$SYNC_TYPE" = "seed_only" ]; then
              echo "Running Prisma seed on target..."
              TARGET_APP=$(docker ps -q -f "name=${TARGET_STACK}_portfolio" | head -1)
              if [ -n "$TARGET_APP" ]; then
                docker exec $TARGET_APP npx prisma db seed
              else
                echo "❌ Target app container not found for seeding!"
                exit 1
              fi
            else
              # Dump from source
              echo "📤 Dumping data from source database..."
              DUMP_FILE="/tmp/db_dump_${SOURCE_SUFFIX}_$(date +%Y%m%d_%H%M%S).sql"

              if [ "$SYNC_TYPE" = "data_only" ]; then
                docker exec $SOURCE_DB pg_dump -U portfolio --data-only --disable-triggers portfolio > $DUMP_FILE
              else
                docker exec $SOURCE_DB pg_dump -U portfolio portfolio > $DUMP_FILE
              fi

              echo "✅ Dump created: $DUMP_FILE ($(wc -c < $DUMP_FILE) bytes)"

              # Import to target
              echo "📥 Importing data to target database..."

              if [ "$SYNC_TYPE" = "schema_and_data" ]; then
                # Drop and recreate all tables
                docker exec $TARGET_DB psql -U portfolio -d portfolio -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
              fi

              # Import the dump
              docker exec -i $TARGET_DB psql -U portfolio -d portfolio < $DUMP_FILE

              echo "✅ Data imported successfully!"

              # Cleanup
              rm -f $DUMP_FILE
            fi

            echo ""
            echo "=== Sync Complete ==="
            echo "🎉 Database sync from ${SOURCE_STACK} to ${TARGET_STACK} completed!"
