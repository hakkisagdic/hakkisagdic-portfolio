name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm_text:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string
      destroy_stack:
        description: 'Remove Docker Stack'
        required: true
        type: boolean
        default: true
      destroy_volumes:
        description: 'Remove Docker Volumes (DATABASE DATA WILL BE LOST!)'
        required: true
        type: boolean
        default: false
      destroy_images:
        description: 'Remove Registry Images'
        required: true
        type: boolean
        default: false

env:
  CUSTOMER_NAME: ${{ vars.CUSTOMER_NAME }}
  CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER || 'azure' }}

jobs:
  validate:
    name: 🔐 Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Check authorized user
        run: |
          ALLOWED_USERS="hakkisagdic"
          ACTOR="${{ github.actor }}"
          if [[ ! " $ALLOWED_USERS " =~ " $ACTOR " ]]; then
            echo "::error::❌ User '$ACTOR' is not authorized"
            exit 1
          fi
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm_text }}" != "DESTROY" ]; then
            echo "::error::❌ Type 'DESTROY' to proceed."
            exit 1
          fi

  destroy-stack:
    name: 🐳 Remove Docker Stack
    needs: validate
    if: inputs.destroy_stack == true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Remove stack from Swarm
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          script: |
            set -e
            ENV_SUFFIX="${{ inputs.environment }}"
            STACK_NAME="${{ env.CUSTOMER_NAME }}-${ENV_SUFFIX}"
            echo "🗑️ Removing stack: $STACK_NAME"
            docker stack rm "$STACK_NAME" || true
            sudo rm -rf "/opt/swarm/customers/$STACK_NAME"

  destroy-images:
    name: 📦 Remove Registry Images
    needs: validate
    if: inputs.destroy_images == true
    runs-on: ubuntu-latest
    steps:
      # Azure Logic
      - name: Login to Azure
        if: env.CLOUD_PROVIDER == 'azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete ACR Images
        if: env.CLOUD_PROVIDER == 'azure'
        run: |
          az acr repository delete --name "${{ vars.ACR_NAME }}" --repository "${{ env.CUSTOMER_NAME }}/app" --yes || true

      # AWS Logic
      - name: Configure AWS credentials
        if: env.CLOUD_PROVIDER == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Delete ECR Images
        if: env.CLOUD_PROVIDER == 'aws'
        run: |
          aws ecr delete-repository --repository-name "${{ env.CUSTOMER_NAME }}/app" --force || true
